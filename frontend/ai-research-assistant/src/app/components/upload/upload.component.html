<!-- ── RIGHT SIDEBAR ── -->
<aside class="sidebar-right">
  <h3>Upload Documents</h3>



  <p *ngIf="selectedFile" style="font-size: small; ">
    {{ selectedFile.name }}
  </p>

  <p *ngIf="uploadMessage">
    {{ uploadMessage }}
  </p>
  <div class="dropzone" id="dropzone">
    <input class="select-file" style="width: 91px;"
      accept=".pdf,.txt,.csv" type="file" (change)="onFileSelected($event)" />

  <button class="btn-upload" (click)="uploadFile()">Upload</button>
